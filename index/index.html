<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoLab Landing Page</title>
  <link rel="stylesheet" href="../styles/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER COMPLETO -->
  <header class="navbar">
    <div class="logo">
      CoLab
    </div>

    <nav class="menu">
      <a href="#" class="activo">Home</a>
      <a href="#">Projects</a>
      <a href="#">Services</a>
      <a href="#">Blog</a>
      <a href="#">About</a>
      <a href="#">Contacts</a>
    </nav>

    <div class="botones">
      <a href="#" class="btn-signin">Sign In</a>
      <a href="#" class="btn-login">Log In</a>
    </div>
  </header>

  <!-- AGREGADO EN PARTE 4: Hero Section -->
  <section class="hero">
    <!-- Lado izquierdo: Textos -->
    <div class="hero-texto">
      <span class="subtitulo">A Trusted Digital Agency</span>
      <h1>We’re A Creative<br>Digital Agency.</h1>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas lorem arcu adipiscing quis.</p>
    </div>

    <!-- Lado derecho: Imagen -->
    <div class="hero-imagen">
      <img src="../assets/hero-img.png" alt="Ilustración CoLab">
    </div>
  </section>

</body>
</html>
